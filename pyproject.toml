[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polymarket-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph==1.1.3",
    "langchain-core==1.2.20",
    "langchain-openai>=0.3,<1.0",
    "httpx>=0.28.1,<1.0",
    "pydantic>=2.12.5,<3.0",
    "pydantic-settings>=2.7.0,<3.0",
    "loguru>=0.7.3,<1.0",
    "rich>=14.0.0,<15.0",
    "python-dotenv>=1.1.0,<2.0",
    "uvicorn[standard]>=0.34.0,<1.0",
    "websockets>=13.0,<15.0",
    "fastapi>=0.115.0,<1.0",
    "python-telegram-bot>=21.0,<22.0",
    "py-clob-client>=0.34.6",
    "polymarket-us>=0.1.0",
    "polars>=1.40.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "ruff>=0.9,<1.0",
    "mypy>=1.14,<2.0",
]
# Research extras for the polybot_research.eml_node project. Heavy ML deps
# isolated here so production installs of the live bot stay lean.
research = [
    "torch>=2.4,<3.0",
    "torchdiffeq>=0.2.5,<1.0",
    "polars>=1.20,<2.0",
    "pyarrow>=18.0,<22.0",
    "mlflow>=2.20,<4.0",
    "pysr>=0.19,<2.0",
    "sympy>=1.13,<2.0",
    "mpmath>=1.3,<2.0",
]

[project.scripts]
scan              = "polybot.cli:run"
dashboard         = "polybot.cli:run_dashboard"
backtest-weather  = "polybot.backtest.engine:run"
backtest-sports   = "polybot.backtest.sports_engine:run"
# Research project entry points (polybot_research.eml_node)
eml-schema-check  = "polybot_research.eml_node.cli:schema_check"
eml-phase0        = "polybot_research.eml_node.cli:phase0"
eml-sanity        = "polybot_research.eml_node.cli:sanity"
eml-status        = "polybot_research.eml_node.cli:status"

[tool.hatch.build.targets.wheel]
packages = ["src/polybot", "src/polybot_research"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.26.0",
]
